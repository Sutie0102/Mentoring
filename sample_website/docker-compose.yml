name: blog

services:
  # ① Presentation Tier: React 빌드 결과물 제공 + /api 리버스 프록시
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks: [front-net]

  # ② Application Tier: REST API
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks: [front-net, back-net]

  # ③ Data Tier: PostgreSQL
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks: [back-net]

volumes:
  db-data:

# frontend는 front-net에만 있으므로 db에 직접 접근할 수 없음
networks:
  front-net:
  back-net:
